apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-client
  namespace: demo
  labels:
    app: ext-client
    app.kubernetes.io/part-of: demo-shop
    app.kubernetes.io/version: "0.55.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-client
  template:
    metadata:
      labels:
        app: ext-client
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/version: "0.55.0"
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          args: ["run", "--quiet", "/scripts/script.js"]
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: ext-client-script
