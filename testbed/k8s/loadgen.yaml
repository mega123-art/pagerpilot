apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
  labels:
    app: loadgen
    app.kubernetes.io/part-of: demo-shop
    app.kubernetes.io/version: "0.55.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/version: "0.55.0"
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          args: ["run", "--quiet", "/scripts/baseline.js"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: loadgen-scripts
