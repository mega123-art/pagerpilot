# Rendered with envsubst (VERSION, GIT_SHA) by `make up`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app: demo-api
    app.kubernetes.io/part-of: demo-shop
    app.kubernetes.io/version: "${VERSION}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/version: "${VERSION}"
      annotations:
        demo-shop/git-sha: "${GIT_SHA}"
    spec:
      containers:
        - name: demo-api
          image: demo-api:${VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
